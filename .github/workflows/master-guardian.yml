name: Master Guardian

on:
  push:
    branches: [main, 'creator/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run evidence guard
        shell: bash
        run: |
          set -euo pipefail
          python3 GOVERNANCE/master_guardian.py

      - name: Secret-pattern guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE --exclude-dir=.git --exclude='*.lock' '(PRIVATE_KEY|MNEMONIC|SEED_PHRASE|API_KEY|SECRET_KEY|BEGIN (RSA|EC|OPENSSH) PRIVATE KEY)' .; then
            echo 'Potential secret material detected. Review before merge.'
            exit 1
          fi
